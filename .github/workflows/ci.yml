# @author hanchao <hanchao@66yunlian.com>
# @since 1.0.0

name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.5
  NODE_VERSION: 24.17.0
  NPM_VERSION: 11.13.0
  NVM_COMMIT: 977563e97ddc66facf3a8e31c6cff01d236f09bd

jobs:
  go:
    name: Go quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the fixed Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run Go unit tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          go mod verify
          go test ./...

  web:
    name: Web quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install nvm and run the fixed frontend toolchain
        shell: bash
        run: |
          set -euo pipefail
          export NVM_DIR="${RUNNER_TEMP}/nvm"
          git clone --filter=blob:none https://github.com/nvm-sh/nvm.git "${NVM_DIR}"
          git -C "${NVM_DIR}" checkout --detach "${NVM_COMMIT}"
          test "$(git -C "${NVM_DIR}" rev-parse HEAD)" = "${NVM_COMMIT}"
          . "${NVM_DIR}/nvm.sh"
          nvm install "${NODE_VERSION}"
          nvm use "${NODE_VERSION}"
          npm install --global "npm@${NPM_VERSION}"
          hash -r
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

          cd web
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build

  scripts:
    name: Repository and script guards
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the fixed Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run repository guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          find tests/docker -type f -name '*.sh' -print0 | sort -z | xargs -0 sh -n
          tests/docker/image_test.sh
          git diff --check

  candidate-amd64:
    name: Docker smoke and multi-platform build
    needs:
      - go
      - web
      - scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANDIDATE_IMAGE: nginx-uix:1.0.0-ci-${{ github.run_id }}-${{ github.run_attempt }}
      REPOSITORY_ROOT: ${{ github.workspace }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the fixed Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Enable arm64 image builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Install the fixed Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.36.0
          install: true

      - name: Prove the native runner and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          docker_architecture="$(docker info --format '{{.Architecture}}')"
          case "${docker_architecture}" in
            amd64|x86_64) ;;
            *) printf 'unexpected Docker architecture: %s\n' "${docker_architecture}" >&2; exit 1 ;;
          esac
          docker buildx version | grep -F 'v0.36.0'

      - name: Build the exact native image and run basic smoke
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${CANDIDATE_IMAGE}" PLATFORM=linux/amd64 BUILD_IMAGE=1 SMOKE_PROFILE=basic \
            "${REPOSITORY_ROOT}/tests/docker/smoke.sh"

      - name: Build amd64 and arm64 binaries and images
        shell: bash
        run: |
          set -euo pipefail
          MULTIARCH_OUTPUT_DIR="${RUNNER_TEMP}/nginx-uix-multiarch" \
            "${REPOSITORY_ROOT}/tests/docker/multiarch.sh"

      - name: Upload binaries and OCI images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nginx-uix-1.0.0-${{ github.sha }}
          path: ${{ runner.temp }}/nginx-uix-multiarch/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
