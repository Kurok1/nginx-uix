# @author hanchao <hanchao@66yunlian.com>
# @since 1.0.0

name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.5
  NODE_VERSION: 24.17.0
  NPM_VERSION: 11.13.0
  NVM_COMMIT: 977563e97ddc66facf3a8e31c6cff01d236f09bd

jobs:
  go:
    name: Go quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the fixed Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run Go quality gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go${GO_VERSION}"

          tool_bin="${RUNNER_TEMP}/nginx-uix-tools"
          mkdir -p "${tool_bin}"
          GOBIN="${tool_bin}" go install golang.org/x/tools/cmd/goimports@v0.48.0
          GOBIN="${tool_bin}" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          export PATH="${tool_bin}:${PATH}"
          go version -m "${tool_bin}/goimports" | grep -F $'mod\tgolang.org/x/tools\tv0.48.0'
          golangci-lint --version | grep -F 'version 2.11.4'

          git ls-files -z '*.go' | xargs -0 goimports -l >"${RUNNER_TEMP}/goimports.out"
          test ! -s "${RUNNER_TEMP}/goimports.out"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
          go test ./...
          go test -race ./...
          go vet ./...
          golangci-lint run

  web:
    name: Web quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install nvm and run the fixed frontend toolchain
        shell: bash
        run: |
          set -euo pipefail
          export NVM_DIR="${RUNNER_TEMP}/nvm"
          git clone --filter=blob:none https://github.com/nvm-sh/nvm.git "${NVM_DIR}"
          git -C "${NVM_DIR}" checkout --detach "${NVM_COMMIT}"
          test "$(git -C "${NVM_DIR}" rev-parse HEAD)" = "${NVM_COMMIT}"
          . "${NVM_DIR}/nvm.sh"
          nvm install "${NODE_VERSION}"
          nvm use "${NODE_VERSION}"
          npm install --global "npm@${NPM_VERSION}"
          hash -r
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

          cd web
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          ./node_modules/.bin/playwright install --with-deps chromium
          npm run test:e2e

  scripts:
    name: Repository and script guards
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the fixed Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run repository guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          find tests/docker -type f -name '*.sh' -print0 | sort -z | xargs -0 sh -n
          tests/docker/image_test.sh
          tests/docker/playwright_summary_test.sh
          git diff --check

  candidate-amd64:
    name: Native amd64 release candidate
    needs:
      - go
      - web
      - scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CANDIDATE_IMAGE: nginx-uix:1.0.0-ci-${{ github.run_id }}-${{ github.run_attempt }}
      REPOSITORY_ROOT: ${{ github.workspace }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the fixed Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install the fixed Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.36.0
          install: true

      - name: Prove the native runner and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          docker_architecture="$(docker info --format '{{.Architecture}}')"
          case "${docker_architecture}" in
            amd64|x86_64) ;;
            *) printf 'unexpected Docker architecture: %s\n' "${docker_architecture}" >&2; exit 1 ;;
          esac
          docker buildx version | grep -F 'v0.36.0'

      - name: Build the exact native image and run basic smoke
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${CANDIDATE_IMAGE}" PLATFORM=linux/amd64 BUILD_IMAGE=1 SMOKE_PROFILE=basic \
            "${REPOSITORY_ROOT}/tests/docker/smoke.sh"

      - name: Run the complete native and multi-architecture candidate matrix
        shell: bash
        run: |
          set -euo pipefail
          NATIVE_IMAGE="${CANDIDATE_IMAGE}" "${REPOSITORY_ROOT}/tests/docker/multiarch.sh"
