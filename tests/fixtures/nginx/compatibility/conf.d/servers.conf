# @since 0.6.0

server {
    listen 127.0.0.1:{{PORT}};
    server_name example.test *.example.test ~^api[0-9]+\.example\.test$;
    root html;

    location = /health {
        return 200 "ok";
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        add_header X-Fixture compatibility always;
        return 204;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://primary_backend;
    }

    location /fallback {
        error_page 418 = @named_fallback;
        return 418;
    }

    location @named_fallback {
        return 200 "named fallback";
    }
}
