# @since 0.6.0

worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log notice;

events {
    worker_connections 32;
}

http {
    access_log off;
    default_type application/octet-stream;

    include conf.d/upstreams.conf;
    include conf.d/maps.conf;
    include conf.d/servers.conf;
}
