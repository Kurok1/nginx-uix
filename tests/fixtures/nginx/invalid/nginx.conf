# @since 0.1.0

worker_processes 1;
pid logs/nginx.pid;
lock_file logs/nginx.lock;
error_log logs/error.log notice;

events {
    worker_connections 64;
}

http {
    server {
        listen 127.0.0.1:{{PORT}};
        server_name localhost;
    }

    nginx_uix_invalid_directive on;
}
