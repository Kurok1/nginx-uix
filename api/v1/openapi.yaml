          maxItems: 64
          items: { $ref: "#/components/schemas/RouteListener" }
        server_names:
          type: array
          minItems: 1
          maxItems: 1024
          items: { type: string }
        disposition: { $ref: "#/components/schemas/RouteCandidateDisposition" }
        reason: { $ref: "#/components/schemas/RouteCandidateReason" }
    RouteMatcherType:
      type: string
      enum: [unknown, exact, prefix, prefix_priority, regex, regex_insensitive, named]
    RouteLocationCandidate:
      type: object
      additionalProperties: false
