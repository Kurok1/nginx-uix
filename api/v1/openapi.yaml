    ConfigAPIErrorCode:
      oneOf:
        - $ref: "#/components/schemas/ConfigErrorCode"
        - type: string
          enum: [invalid_request, unauthenticated, origin_rejected, csrf_rejected, unsupported_media_type, service_unavailable, internal_error]
    ConfigAPIErrorDetails:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
          description: Safe configuration-root relative path; semantic limit is 1024 UTF-8 bytes and 64 components.
        field:
          type: string
          enum: [attention_case_id, attention_id, backup_id, body, confirm_backup_id, confirm_name, confirm_path, confirmation, content, cursor, destination_path, expected_protected, group_id, include_deleted, input, kind, limit, members, name, path, preview_id, protected, query, reason, restart_id, restore_id, retention_id, route_id, run_id, source_path, state, workspace_id]
        backup_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        stage:
          type: string
          pattern: "^[a-z0-9_]+$"
        state:
          type: string
          pattern: "^[a-z0-9_]+$"
        reason_code:
          type: string
          pattern: "^[a-z0-9_]+$"
        object_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        http_status:
          type: integer
          minimum: 100
          maximum: 599
        current_etag:
          type: string
          pattern: '^"(?:draft|groups)-v1:[0-9a-f]{64}"$'
        limit_name:
          type: string
          enum: [request_body_bytes, file_bytes, entries, managed_bytes, workspaces, workspace_bytes, groups, group_members, total_group_members, diff_response_bytes, search_matches, search_query_bytes, include_token_bytes, include_directive_bytes, include_edges, include_depth, structured_tokens, structured_nodes, structured_contexts, structured_diff_bytes]
        limit_value:
          type: integer
          format: int64
          minimum: 0
        actual:
          type: integer
          format: int64
          minimum: 0
    ConfigAPIErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          $ref: "#/components/schemas/ConfigAPIErrorCode"
        message:
          type: string
        request_id:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
        details:
          $ref: "#/components/schemas/ConfigAPIErrorDetails"
    APIErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ConfigAPIErrorBody"
