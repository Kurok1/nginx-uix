        next_cursor: { $ref: "#/components/schemas/RecoveryCursorValue" }
    BackupProtectionReason:
      type: object
      additionalProperties: false
      required: [kind, code]
      properties:
        kind: { type: string, pattern: "^[a-z0-9_]+$", minLength: 1, maxLength: 64 }
        code: { type: string, pattern: "^[a-z0-9_]+$", minLength: 1, maxLength: 64 }
    ConfigBackup:
      type: object
      additionalProperties: false
      required: [id, origin_type, origin_id, production_digest, state, entry_count, total_bytes, body_present, protected, manually_protected, protections, created_at]
      properties:
        id: { type: string, pattern: "^[0-9a-f]{32}$" }
        origin_type: { type: string, enum: [release, restore] }
        origin_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        release_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        production_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        state: { type: string, enum: [creating, complete, invalid, deleting, deleted] }
        entry_count: { type: integer, minimum: 0, maximum: 4096 }
        total_bytes: { type: integer, format: int64, minimum: 0 }
        body_present:
          type: boolean
          description: Integrity evidence only; backup file content is never returned.
        protected: { type: boolean }
        manually_protected: { type: boolean }
        protection_reason: { type: string, pattern: "^[a-z0-9_]+$", maxLength: 64 }
        protections:
          type: array
