          description: Current durable restore projection
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: *RecoveryNoStoreHeader
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigRestore" }
        "400": { $ref: "#/components/responses/ConfigAPIError" }
        "401": { $ref: "#/components/responses/ConfigAPIError" }
        "404": { $ref: "#/components/responses/ConfigAPIError" }
        "500": { $ref: "#/components/responses/ConfigAPIError" }
        "503": { $ref: "#/components/responses/ConfigAPIError" }
  /api/v1/config/restores/{restore_id}/events:
    get:
      operationId: streamConfigRestoreEvents
      summary: Resume persisted restore stages by Last-Event-ID
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RestoreID"
        - $ref: "#/components/parameters/LastEventID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: SSE snapshot, stage, terminal, and heartbeat events
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: *RecoveryNoStoreHeader
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/ConfigAPIError" }
        "401": { $ref: "#/components/responses/ConfigAPIError" }
        "404": { $ref: "#/components/responses/ConfigAPIError" }
        "500": { $ref: "#/components/responses/ConfigAPIError" }
        "503": { $ref: "#/components/responses/ConfigAPIError" }
  /api/v1/nginx/restarts:
    post:
      operationId: createNginxRestart
      summary: Queue the fixed supervised Nginx restart
      description: Validates production first and accepts no PID, signal, command, path, timeout, or health target.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        description: Strict JSON object limited to 4096 bytes.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestartRequest" }
      responses:
        "202":
          description: Durable queued fixed restart; this response is not runtime success
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: *RecoveryNoStoreHeader
            Location: *RecoveryLocationHeader
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NginxRestart" }
        "400": { $ref: "#/components/responses/ConfigAPIError" }
        "401": { $ref: "#/components/responses/ConfigAPIError" }
        "403": { $ref: "#/components/responses/ConfigAPIError" }
        "409": { $ref: "#/components/responses/ConfigAPIError" }
        "413": { $ref: "#/components/responses/ConfigAPIError" }
        "415": { $ref: "#/components/responses/ConfigAPIError" }
        "422": { $ref: "#/components/responses/ConfigAPIError" }
        "500": { $ref: "#/components/responses/ConfigAPIError" }
        "503": { $ref: "#/components/responses/ConfigAPIError" }
        "504": { $ref: "#/components/responses/ConfigAPIError" }
  /api/v1/nginx/restarts/{restart_id}:
    get:
      operationId: getNginxRestart
      summary: Get one persisted fixed restart task and its stages
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RestartID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Current durable restart projection
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: *RecoveryNoStoreHeader
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NginxRestart" }
        "400": { $ref: "#/components/responses/ConfigAPIError" }
        "401": { $ref: "#/components/responses/ConfigAPIError" }
        "404": { $ref: "#/components/responses/ConfigAPIError" }
        "500": { $ref: "#/components/responses/ConfigAPIError" }
        "503": { $ref: "#/components/responses/ConfigAPIError" }
  /api/v1/nginx/restarts/{restart_id}/events:
    get:
      operationId: streamNginxRestartEvents
      summary: Resume persisted fixed-restart stages by Last-Event-ID
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RestartID"
        - $ref: "#/components/parameters/LastEventID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: SSE snapshot, stage, terminal, and heartbeat events
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: *RecoveryNoStoreHeader
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/ConfigAPIError" }
        "401": { $ref: "#/components/responses/ConfigAPIError" }
        "404": { $ref: "#/components/responses/ConfigAPIError" }
        "500": { $ref: "#/components/responses/ConfigAPIError" }
        "503": { $ref: "#/components/responses/ConfigAPIError" }
  /api/v1/config/audit-events:
    get:
      operationId: listConfigAuditEvents
      summary: List bounded redacted configuration audit events
      description: Cursor and limit are each accepted exactly once when present. Details contain only public scalar evidence.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RecoveryCursor"
        - $ref: "#/components/parameters/RecoveryLimit"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Bounded newest-first audit page
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: *RecoveryNoStoreHeader
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "400": { $ref: "#/components/responses/ConfigAPIError" }
        "401": { $ref: "#/components/responses/ConfigAPIError" }
        "500": { $ref: "#/components/responses/ConfigAPIError" }
        "503": { $ref: "#/components/responses/ConfigAPIError" }
  /api/v1/config/attention-cases:
    get:
      operationId: listConfigAttentionCases
      summary: List unresolved or resolved attention cases
      description: State, cursor, and limit are each accepted exactly once when present. Cases contain safe evidence references only.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AttentionState"
        - $ref: "#/components/parameters/RecoveryCursor"
        - $ref: "#/components/parameters/RecoveryLimit"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Bounded newest-first attention page
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: *RecoveryNoStoreHeader
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttentionCasePage" }
        "400": { $ref: "#/components/responses/ConfigAPIError" }
        "401": { $ref: "#/components/responses/ConfigAPIError" }
        "500": { $ref: "#/components/responses/ConfigAPIError" }
        "503": { $ref: "#/components/responses/ConfigAPIError" }
  /api/v1/config/attention-cases/{attention_id}:
    get:
      operationId: getConfigAttentionCase
      summary: Get one attention case and its durable resolution reference
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AttentionID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Current attention-case projection
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: *RecoveryNoStoreHeader
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttentionCase" }
        "400": { $ref: "#/components/responses/ConfigAPIError" }
        "401": { $ref: "#/components/responses/ConfigAPIError" }
        "404": { $ref: "#/components/responses/ConfigAPIError" }
        "500": { $ref: "#/components/responses/ConfigAPIError" }
        "503": { $ref: "#/components/responses/ConfigAPIError" }
  /api/v1/config/attention-cases/{attention_id}/verifications:
    post:
      operationId: createConfigAttentionVerification
      summary: Verify current production and runtime evidence for one attention case
      description: Runs only fixed production validation, unique runtime sampling, and loopback HTTP health checks.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AttentionID"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        description: Strict JSON object limited to 4096 bytes.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyObject" }
      responses:
        "201":
          description: Persisted verification; only a succeeded result resolves the attention case
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: *RecoveryNoStoreHeader
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeVerification" }
        "400": { $ref: "#/components/responses/ConfigAPIError" }
        "401": { $ref: "#/components/responses/ConfigAPIError" }
        "403": { $ref: "#/components/responses/ConfigAPIError" }
        "404": { $ref: "#/components/responses/ConfigAPIError" }
        "409": { $ref: "#/components/responses/ConfigAPIError" }
        "413": { $ref: "#/components/responses/ConfigAPIError" }
        "415": { $ref: "#/components/responses/ConfigAPIError" }
        "422": { $ref: "#/components/responses/ConfigAPIError" }
        "500": { $ref: "#/components/responses/ConfigAPIError" }
        "503": { $ref: "#/components/responses/ConfigAPIError" }
        "504": { $ref: "#/components/responses/ConfigAPIError" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nginx_uix_session
  headers:
    RequestID:
      description: Correlation identifier generated or accepted by the request boundary.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      description: Opaque workspace identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    GroupID:
      name: group_id
      in: path
      required: true
      description: Opaque logical group identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    CheckID:
      name: check_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    ReleaseID:
      name: release_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    BackupID:
      name: backup_id
      in: path
      required: true
      description: Opaque immutable backup identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    RetentionID:
      name: retention_id
      in: path
      required: true
      description: Opaque retention dry-run identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    RestoreID:
      name: restore_id
      in: path
      required: true
      description: Opaque manual restore task identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    RestartID:
      name: restart_id
      in: path
      required: true
      description: Opaque fixed restart task identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    AttentionID:
      name: attention_id
      in: path
      required: true
      description: Opaque attention-case identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    RecoveryCursor:
      name: cursor
      in: query
      required: false
      description: Opaque versioned keyset cursor accepted exactly once when present.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
        pattern: "^[A-Za-z0-9_-]+$"
    RecoveryLimit:
      name: limit
      in: query
      required: false
      description: Page size from 1 through 100 accepted exactly once when present; defaults to 50.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    IncludeDeleted:
      name: include_deleted
      in: query
      required: false
      description: Boolean tombstone selector accepted exactly once when present; defaults to false.
      schema:
        type: boolean
    AttentionState:
      name: state
      in: query
      required: false
      description: Optional case-state selector accepted exactly once when present.
      schema:
        type: string
        enum: [open, resolved]
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: Last persisted stage sequence received by the client.
      schema:
        type: integer
        minimum: 0
        maximum: 512
    RequiredConfigPath:
      name: path
      in: query
      required: true
      description: Relative configuration path required exactly once; 1024 UTF-8 bytes maximum.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exactly one quoted strong workspace or group collection identity; weak and comma-separated values are rejected.
      schema:
        type: string
        pattern: '^"(?:draft|groups)-v1:[0-9a-f]{64}"$'
  responses:
    APIError:
      description: Stable API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ConfigAPIError:
      description: Stable configuration API error
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
  schemas:
    LivenessStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    SessionUser:
      type: object
      additionalProperties: false
      required: [id, username, created_at]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        created_at:
          type: string
          format: date-time
    Session:
      type: object
      additionalProperties: false
      required: [user, csrf_token, created_at, last_seen_at, idle_expires_at, absolute_expires_at]
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        csrf_token:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
    SystemStatus:
      type: object
      additionalProperties: false
      required: [sampled_at, components, master, workers, build, startup_validation, recovery, issues]
      properties:
        sampled_at:
          type: string
          format: date-time
        components:
          $ref: "#/components/schemas/SystemStatusComponents"
        master:
          oneOf:
            - $ref: "#/components/schemas/SystemProcess"
            - type: "null"
        workers:
          type: array
          items:
            $ref: "#/components/schemas/SystemProcess"
        build:
          oneOf:
            - $ref: "#/components/schemas/SystemBuild"
            - type: "null"
        startup_validation:
          oneOf:
            - $ref: "#/components/schemas/StartupValidation"
            - type: "null"
        recovery:
          oneOf:
            - $ref: "#/components/schemas/RecoveryState"
            - type: "null"
        issues:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Z][A-Z0-9_]*$"
    SystemStatusComponents:
      type: object
      additionalProperties: false
      required: [ui, agent, nginx]
      properties:
        ui:
          type: string
          enum: [healthy]
        agent:
          type: string
          enum: [healthy, unavailable]
        nginx:
          type: string
          enum: [running, degraded, stopped, unknown]
    SystemProcess:
      type: object
      additionalProperties: false
      required: [pid, role, started_at]
      properties:
        pid:
          type: integer
          minimum: 1
        role:
          type: string
          enum: [master, worker]
        started_at:
          type: string
          format: date-time
    SystemBuild:
      type: object
      additionalProperties: false
      required: [version, configure_arguments]
      properties:
        version:
          type: string
        configure_arguments:
          type: array
          items:
            type: string
    StartupValidation:
      type: object
      additionalProperties: false
      required: [valid, checked_at, exit_code, diagnostic]
      properties:
        valid:
          type: boolean
        checked_at:
          type: string
          format: date-time
        exit_code:
          type: [integer, "null"]
        diagnostic:
          type: string
          maxLength: 262144
    RecoveryState:
      type: object
      additionalProperties: false
      required: [count, last_result, permanent]
      properties:
        count:
          type: integer
          minimum: 0
        last_result:
          type: string
          enum: ["", restarting, invalid_config, permanent_failure]
        permanent:
          type: boolean
    EffectiveConfig:
      type: object
      additionalProperties: false
      required:
        [
          generated_at,
          nginx_version,
          entry_config_path,
          display_mode,
          occurrence_count,
          occurrences,
          raw_content,
          warnings,
        ]
      properties:
        generated_at:
          type: string
          format: date-time
        nginx_version:
          type: string
        entry_config_path:
          type: string
          const: /etc/nginx/nginx.conf
        display_mode:
          type: string
          enum: [structured, raw]
        occurrence_count:
          type: integer
          minimum: 0
        occurrences:
          type: array
          items:
            $ref: "#/components/schemas/ConfigOccurrence"
        raw_content:
          type: [string, "null"]
          maxLength: 16777216
        warnings:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/EffectiveConfigWarning"
      oneOf:
        - title: Byte-verified file occurrences
          properties:
            display_mode:
              const: structured
            raw_content:
              type: "null"
            warnings:
              maxItems: 0
        - title: Unstructured bounded nginx output
          properties:
            display_mode:
              const: raw
            occurrence_count:
              const: 0
            occurrences:
              maxItems: 0
            raw_content:
              type: string
              minLength: 1
            warnings:
              minItems: 1
    EffectiveConfigWarning:
      type: string
      enum:
        - NGINX_CONFIG_PATH_OUTSIDE_ALLOWED_ROOTS
        - NGINX_CONFIG_STRUCTURE_UNVERIFIED
    ConfigOccurrence:
      type: object
      additionalProperties: false
      required: [id, load_order, path, content]
      properties:
        id:
          type: string
        load_order:
          type: integer
          minimum: 1
        path:
          type: string
        content:
          type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    WorkspaceSummary:
      type: object
      additionalProperties: false
      required: [id, name, state, production_digest, base_digest, draft_etag, entry_count, managed_bytes, workspace_bytes, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        name:
          type: string
          minLength: 1
          maxLength: 80
        state:
          type: string
          enum: [preparing, ready, stale, published, needs_attention]
        state_reason_code:
          type: string
          pattern: "^[a-z0-9_]*$"
        production_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        base_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        draft_etag:
          type: string
          description: Quoted strong workspace identity using the draft-v1 canonical digest algorithm.
          pattern: '^"draft-v1:[0-9a-f]{64}"$'
        entry_count:
          type: integer
          minimum: 0
          maximum: 4096
        managed_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 33554432
        workspace_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 536870912
        created_by:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_release_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
    WorkspaceDetail:
      type: object
      additionalProperties: false
      required: [id, name, state, production_digest, base_digest, draft_etag, entry_count, managed_bytes, workspace_bytes, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        name:
          type: string
          minLength: 1
          maxLength: 80
        state:
          type: string
          enum: [preparing, ready, stale, published, needs_attention]
        state_reason_code:
          type: string
          pattern: "^[a-z0-9_]*$"
        production_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        base_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        draft_etag:
          type: string
          description: Quoted strong workspace identity using the draft-v1 canonical digest algorithm.
          pattern: '^"draft-v1:[0-9a-f]{64}"$'
        entry_count:
          type: integer
          minimum: 0
          maximum: 4096
        managed_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 33554432
        workspace_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 536870912
        created_by:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_release_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
    CreateReleaseRequest:
      type: object
      additionalProperties: false
      required: [check_id, confirm_name]
      properties:
        check_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        confirm_name:
          type: string
          minLength: 1
          maxLength: 128
    EmptyObject:
      type: object
      additionalProperties: false
    CandidateDiagnostic:
      type: object
      additionalProperties: false
      required: [code, path, line, summary]
      properties:
        code: { type: string, pattern: "^[a-z0-9_]+$", minLength: 1, maxLength: 64 }
        path:
          type: string
          maxLength: 1024
          description: Empty when no safe candidate-relative path can be identified.
        line: { type: integer, minimum: 0, maximum: 10000000 }
        summary: { type: string, minLength: 1, maxLength: 512 }
    PublishCheck:
      type: object
      additionalProperties: false
      required: [id, workspace_id, workspace_revision, production_digest, base_digest, draft_digest, candidate_digest, manifest_version, policy_version, validator_version, validator_build_id, state, diagnostic_count, details, started_at, finished_at, expires_at]
      properties:
        id: { type: string, pattern: "^[0-9a-f]{32}$" }
        workspace_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        workspace_revision: { type: integer, minimum: 1 }
        production_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        base_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        draft_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        candidate_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        manifest_version: { type: integer, minimum: 1 }
        policy_version: { type: integer, minimum: 1 }
        validator_version: { type: integer, minimum: 1 }
        validator_build_id: { type: string }
        state: { type: string, enum: [running, valid, invalid, failed] }
