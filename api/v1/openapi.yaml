          pattern: '^"groups-v1:[0-9a-f]{64}"$'
    ConfigGroup:
      type: object
      additionalProperties: false
      required: [id, name, sort_order, members, missing, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        name:
          type: string
          minLength: 1
          maxLength: 64
        sort_order:
          type: integer
        members:
          type: array
          minItems: 0
          maxItems: 1024
          uniqueItems: true
