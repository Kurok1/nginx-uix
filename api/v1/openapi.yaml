          maxItems: 4096
          items:
            $ref: "#/components/schemas/FileDiffSummary"
        complete:
          type: boolean
        reason:
          type: string
          enum: ["", response_limit]
        patch:
          type: string
          description: Complete unified text when complete is true; empty when the bounded response cannot carry it.
    FileDiffSummary:
      type: object
      additionalProperties: false
