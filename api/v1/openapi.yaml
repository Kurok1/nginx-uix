        missing:
          type: array
          minItems: 0
          maxItems: 1024
          uniqueItems: true
          items:
            type: string
            description: Member absent from the optional workspace view; semantic limit is 1024 UTF-8 bytes and 64 components.
        created_by:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GroupMutationRequest:
      type: object
      additionalProperties: false
      required: [name, sort_order, members]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        sort_order:
          type: integer
        members:
          type: array
          minItems: 0
          maxItems: 1024
          uniqueItems: true
          items:
            type: string
            description: Configuration-root relative member path; semantic limit is 1024 UTF-8 bytes and 64 components.
    DeleteGroupRequest:
      type: object
      additionalProperties: false
      required: [confirm_name]
      properties:
        confirm_name:
          type: string
          minLength: 1
          maxLength: 64
    RecoveryCursorValue:
      type: string
