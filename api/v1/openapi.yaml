# @author hanchao <hanchao@66yunlian.com>
# @since 0.1.0
openapi: 3.1.0
info:
  title: Nginx UIX API
  version: 0.2.3
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the UI process can serve HTTP
      responses:
        "200":
          description: UI process is live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessStatus"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check aggregate management readiness
      responses:
        "200":
          description: Required management components are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: At least one required component is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /api/v1/auth/session:
    post:
      operationId: createSession
      summary: Authenticate the administrator
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "413":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "429":
          description: Login rate limit is active
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      operationId: getSession
      summary: Restore the current authenticated session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/APIError"
    delete:
      operationId: deleteSession
      summary: End the current authenticated session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "204":
          description: Session removed and browser cookie expired
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      summary: Get the aggregate UI, Agent and verified Nginx status
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Aggregate status, including partial evidence when the Agent is unavailable
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/nginx/effective-config:
    get:
      operationId: getEffectiveConfig
      summary: Get the ordered effective configuration reported by nginx -T
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Byte-verified ordered configuration or a bounded raw nginx -T fallback
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveConfig"
        "401":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
        "502":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/APIError"
        "504":
          $ref: "#/components/responses/APIError"
  /api/v1/config/workspaces:
    get:
      operationId: listConfigWorkspaces
      summary: List bounded configuration workspaces
      description: Returns at most eight workspaces ordered by updated_at descending and id ascending. Unknown query parameters are rejected.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Stable workspace list
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
        "400":
          $ref: "#/components/responses/ConfigAPIError"
        "401":
          $ref: "#/components/responses/ConfigAPIError"
        "413":
          $ref: "#/components/responses/ConfigAPIError"
        "500":
          $ref: "#/components/responses/ConfigAPIError"
        "503":
          $ref: "#/components/responses/ConfigAPIError"
        "504":
          $ref: "#/components/responses/ConfigAPIError"
    post:
      operationId: createConfigWorkspace
      summary: Create a persistent configuration workspace
      description: Creates a bounded workspace from a stable production snapshot. Unknown query parameters are rejected.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        description: Strict JSON object limited to 4096 bytes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Ready workspace
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            ETag:
              schema:
                type: string
                pattern: '^"draft-v1:[0-9a-f]{64}"$'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDetail"
        "400":
          $ref: "#/components/responses/ConfigAPIError"
        "401":
          $ref: "#/components/responses/ConfigAPIError"
        "403":
          $ref: "#/components/responses/ConfigAPIError"
        "409":
          $ref: "#/components/responses/ConfigAPIError"
        "413":
          $ref: "#/components/responses/ConfigAPIError"
        "415":
          $ref: "#/components/responses/ConfigAPIError"
        "422":
          $ref: "#/components/responses/ConfigAPIError"
        "500":
          $ref: "#/components/responses/ConfigAPIError"
        "503":
          $ref: "#/components/responses/ConfigAPIError"
        "504":
          $ref: "#/components/responses/ConfigAPIError"
  /api/v1/config/workspaces/{workspace_id}:
    get:
      operationId: getConfigWorkspace
      summary: Get one configuration workspace
      description: Returns current bounded workspace metadata. Unknown query parameters are rejected.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Current workspace metadata
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            ETag:
              schema:
                type: string
                pattern: '^"draft-v1:[0-9a-f]{64}"$'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDetail"
        "400":
          $ref: "#/components/responses/ConfigAPIError"
        "401":
          $ref: "#/components/responses/ConfigAPIError"
        "404":
          $ref: "#/components/responses/ConfigAPIError"
        "500":
          $ref: "#/components/responses/ConfigAPIError"
        "503":
          $ref: "#/components/responses/ConfigAPIError"
        "504":
          $ref: "#/components/responses/ConfigAPIError"
    delete:
      operationId: deleteConfigWorkspace
      summary: Delete one named configuration workspace
      description: Deletes only the selected persistent workspace after exact name and strong workspace identity confirmation. Unknown query parameters are rejected.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        description: Strict JSON object limited to 262144 bytes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteWorkspaceRequest"
      responses:
        "204":
          description: Workspace deleted
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
        "400":
          $ref: "#/components/responses/ConfigAPIError"
        "401":
          $ref: "#/components/responses/ConfigAPIError"
        "403":
          $ref: "#/components/responses/ConfigAPIError"
        "404":
          $ref: "#/components/responses/ConfigAPIError"
        "409":
          $ref: "#/components/responses/ConfigAPIError"
        "413":
          $ref: "#/components/responses/ConfigAPIError"
        "415":
          $ref: "#/components/responses/ConfigAPIError"
        "422":
          $ref: "#/components/responses/ConfigAPIError"
        "500":
          $ref: "#/components/responses/ConfigAPIError"
        "503":
          $ref: "#/components/responses/ConfigAPIError"
        "504":
          $ref: "#/components/responses/ConfigAPIError"
  /api/v1/config/workspaces/{workspace_id}/files:
    get:
      operationId: getConfigWorkspaceFiles
      summary: Get the configuration tree or one explicit managed file
      description: Without path returns the complete bounded tree; with path returns only that managed text file. Unknown or repeated query parameters are rejected.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - name: path
          in: query
          required: false
          description: Optional relative path accepted exactly once when present; 1024 UTF-8 bytes maximum.
          schema:
            type: string
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Configuration tree or explicit file
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            ETag:
              schema:
                type: string
                pattern: '^"draft-v1:[0-9a-f]{64}"$'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ConfigTree"
                  - $ref: "#/components/schemas/ConfigFile"
        "400":
          $ref: "#/components/responses/ConfigAPIError"
        "401":
          $ref: "#/components/responses/ConfigAPIError"
        "404":
          $ref: "#/components/responses/ConfigAPIError"
        "413":
          $ref: "#/components/responses/ConfigAPIError"
        "422":
          $ref: "#/components/responses/ConfigAPIError"
        "500":
          $ref: "#/components/responses/ConfigAPIError"
        "503":
          $ref: "#/components/responses/ConfigAPIError"
        "504":
          $ref: "#/components/responses/ConfigAPIError"
    post:
      operationId: createConfigFile
      summary: Create one managed text file
      description: Creates a new relative path without replacing an existing entry. Unknown query parameters are rejected.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        description: Strict JSON envelope limited to 2162688 bytes, containing at most 2097152 UTF-8 content bytes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileRequest"
      responses:
        "201":
          description: File created and workspace identity rotated
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            ETag:
              schema:
                type: string
                pattern: '^"draft-v1:[0-9a-f]{64}"$'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMutationResponse"
        "400":
          $ref: "#/components/responses/ConfigAPIError"
        "401":
          $ref: "#/components/responses/ConfigAPIError"
        "403":
          $ref: "#/components/responses/ConfigAPIError"
        "404":
          $ref: "#/components/responses/ConfigAPIError"
        "409":
          $ref: "#/components/responses/ConfigAPIError"
        "413":
          $ref: "#/components/responses/ConfigAPIError"
        "415":
          $ref: "#/components/responses/ConfigAPIError"
        "422":
          $ref: "#/components/responses/ConfigAPIError"
        "500":
          $ref: "#/components/responses/ConfigAPIError"
        "503":
          $ref: "#/components/responses/ConfigAPIError"
        "504":
          $ref: "#/components/responses/ConfigAPIError"
    put:
      operationId: replaceConfigFile
      summary: Replace one managed text file
      description: Replaces the file selected by the required path query. Unknown or repeated query parameters are rejected.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/RequiredConfigPath"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        description: Strict JSON envelope limited to 2162688 bytes, containing at most 2097152 UTF-8 content bytes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceFileRequest"
      responses:
        "200":
          description: File replaced and workspace identity rotated
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            ETag:
              schema:
                type: string
                pattern: '^"draft-v1:[0-9a-f]{64}"$'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMutationResponse"
        "400":
          $ref: "#/components/responses/ConfigAPIError"
        "401":
          $ref: "#/components/responses/ConfigAPIError"
        "403":
          $ref: "#/components/responses/ConfigAPIError"
        "404":
          $ref: "#/components/responses/ConfigAPIError"
        "409":
          $ref: "#/components/responses/ConfigAPIError"
        "413":
          $ref: "#/components/responses/ConfigAPIError"
        "415":
          $ref: "#/components/responses/ConfigAPIError"
        "422":
          $ref: "#/components/responses/ConfigAPIError"
        "500":
          $ref: "#/components/responses/ConfigAPIError"
        "503":
          $ref: "#/components/responses/ConfigAPIError"
        "504":
          $ref: "#/components/responses/ConfigAPIError"
    patch:
      operationId: renameConfigFile
      summary: Rename one managed text file
      description: Moves the file selected by the required path query to a new non-existing relative path. Unknown or repeated query parameters are rejected.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/RequiredConfigPath"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        description: Strict JSON object limited to 262144 bytes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameFileRequest"
      responses:
        "200":
          description: File renamed and workspace identity rotated
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            ETag:
              schema:
                type: string
                pattern: '^"draft-v1:[0-9a-f]{64}"$'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMutationResponse"
        "400":
          $ref: "#/components/responses/ConfigAPIError"
        "401":
          $ref: "#/components/responses/ConfigAPIError"
        "403":
          $ref: "#/components/responses/ConfigAPIError"
        "404":
          $ref: "#/components/responses/ConfigAPIError"
        "409":
          $ref: "#/components/responses/ConfigAPIError"
        "413":
          $ref: "#/components/responses/ConfigAPIError"
        "415":
          $ref: "#/components/responses/ConfigAPIError"
        "422":
          $ref: "#/components/responses/ConfigAPIError"
        "500":
          $ref: "#/components/responses/ConfigAPIError"
        "503":
          $ref: "#/components/responses/ConfigAPIError"
        "504":
          $ref: "#/components/responses/ConfigAPIError"
    delete:
      operationId: deleteConfigFile
      summary: Delete one confirmed managed text file
      description: Deletes the file selected by the required path query after exact path confirmation. Unknown or repeated query parameters are rejected.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/RequiredConfigPath"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        description: Strict JSON object limited to 262144 bytes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteFileRequest"
      responses:
        "200":
          description: File deleted and workspace identity rotated
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            ETag:
              schema:
                type: string
                pattern: '^"draft-v1:[0-9a-f]{64}"$'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMutationResponse"
        "400":
          $ref: "#/components/responses/ConfigAPIError"
        "401":
          $ref: "#/components/responses/ConfigAPIError"
        "403":
          $ref: "#/components/responses/ConfigAPIError"
        "404":
          $ref: "#/components/responses/ConfigAPIError"
        "409":
          $ref: "#/components/responses/ConfigAPIError"
        "413":
          $ref: "#/components/responses/ConfigAPIError"
        "415":
          $ref: "#/components/responses/ConfigAPIError"
        "422":
          $ref: "#/components/responses/ConfigAPIError"
        "500":
          $ref: "#/components/responses/ConfigAPIError"
        "503":
          $ref: "#/components/responses/ConfigAPIError"
        "504":
          $ref: "#/components/responses/ConfigAPIError"
  /api/v1/config/workspaces/{workspace_id}/files/copies:
    post:
      operationId: copyConfigFile
      summary: Copy one managed text file
      description: Copies one relative source path to a new non-existing relative destination. Unknown query parameters are rejected.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        description: Strict JSON object limited to 262144 bytes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyFileRequest"
      responses:
        "201":
          description: File copied and workspace identity rotated
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            ETag:
              schema:
                type: string
                pattern: '^"draft-v1:[0-9a-f]{64}"$'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMutationResponse"
        "400":
          $ref: "#/components/responses/ConfigAPIError"
        "401":
          $ref: "#/components/responses/ConfigAPIError"
        "403":
          $ref: "#/components/responses/ConfigAPIError"
        "404":
          $ref: "#/components/responses/ConfigAPIError"
        "409":
          $ref: "#/components/responses/ConfigAPIError"
        "413":
          $ref: "#/components/responses/ConfigAPIError"
        "415":
          $ref: "#/components/responses/ConfigAPIError"
        "422":
          $ref: "#/components/responses/ConfigAPIError"
        "500":
          $ref: "#/components/responses/ConfigAPIError"
        "503":
          $ref: "#/components/responses/ConfigAPIError"
        "504":
          $ref: "#/components/responses/ConfigAPIError"
  /api/v1/config/workspaces/{workspace_id}/files/search:
    get:
      operationId: searchConfigFiles
      summary: Search managed draft text literally
      description: Returns at most 500 matches in stable path, line and column order. Unknown or repeated query parameters are rejected.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - name: query
          in: query
          required: true
          description: Non-empty literal UTF-8 query required exactly once and limited to 256 UTF-8 bytes.
          schema:
            type: string
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Bounded literal matches
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/ConfigAPIError"
        "401":
          $ref: "#/components/responses/ConfigAPIError"
        "404":
          $ref: "#/components/responses/ConfigAPIError"
        "413":
          $ref: "#/components/responses/ConfigAPIError"
        "422":
          $ref: "#/components/responses/ConfigAPIError"
        "500":
          $ref: "#/components/responses/ConfigAPIError"
        "503":
          $ref: "#/components/responses/ConfigAPIError"
        "504":
          $ref: "#/components/responses/ConfigAPIError"
  /api/v1/config/workspaces/{workspace_id}/diff:
    get:
      operationId: getConfigDiff
      summary: Get bounded base-to-draft differences
      description: Without path compares the complete workspace; with path compares exactly one managed file. Unknown or repeated query parameters are rejected.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - name: path
          in: query
          required: false
          description: Optional relative path accepted exactly once when present; 1024 UTF-8 bytes maximum.
          schema:
            type: string
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Complete diff or complete summaries without a patch when the response limit is reached
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffResponse"
        "400":
          $ref: "#/components/responses/ConfigAPIError"
        "401":
          $ref: "#/components/responses/ConfigAPIError"
        "404":
          $ref: "#/components/responses/ConfigAPIError"
        "413":
          $ref: "#/components/responses/ConfigAPIError"
        "422":
          $ref: "#/components/responses/ConfigAPIError"
        "500":
          $ref: "#/components/responses/ConfigAPIError"
        "503":
          $ref: "#/components/responses/ConfigAPIError"
        "504":
          $ref: "#/components/responses/ConfigAPIError"
  /api/v1/config/workspaces/{workspace_id}/publish-checks:
    post:
      operationId: createConfigPublishCheck
      summary: Validate one complete digest-bound publication candidate
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
