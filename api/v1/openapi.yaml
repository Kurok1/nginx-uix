    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, occurred_at, actor_name, action, object_type, object_id, result, request_id, details]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        occurred_at: { type: string, format: date-time }
        actor_name: { type: string, maxLength: 128 }
        action: { type: string, pattern: "^[a-z0-9_.]+$", maxLength: 128 }
        object_type: { type: string, pattern: "^[a-z0-9_]+$", maxLength: 64 }
        object_id: { type: string, pattern: "^[A-Za-z0-9._-]{1,128}$" }
        result: { type: string, pattern: "^[a-z0-9_]+$", maxLength: 64 }
        request_id: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }
        details:
          type: object
          description: Server-whitelisted public scalar details; never raw JSON, configuration content, paths, confirmations, or process output.
          maxProperties: 16
          additionalProperties:
            oneOf:
              - { type: string, maxLength: 128 }
              - { type: integer }
              - { type: boolean }
    AttentionCasePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 100
          items: { $ref: "#/components/schemas/AttentionCase" }
        next_cursor: { $ref: "#/components/schemas/RecoveryCursorValue" }
    AttentionCase:
      type: object
      additionalProperties: false
      required: [id, subject_type, subject_id, state, reason_code, opened_at]
      properties:
        id: { type: string, pattern: "^[0-9a-f]{32}$" }
        subject_type: { type: string, enum: [workspace, release, restore, restart] }
        subject_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        workspace_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        backup_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        state: { type: string, enum: [open, resolved] }
        reason_code: { type: string, pattern: "^[a-z0-9_]+$", minLength: 1, maxLength: 64 }
        opened_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        resolution_type: { type: string, enum: [restore, restart, verification] }
        resolution_id: { type: string, pattern: "^[0-9a-f]{32}$" }
    RuntimeVerification:
      type: object
      additionalProperties: false
      required: [id, attention_case_id, state, production_digest, worker_count, request_id, created_at, finished_at]
      properties:
        id: { type: string, pattern: "^[0-9a-f]{32}$" }
        attention_case_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        state: { type: string, enum: [succeeded, failed] }
        production_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        master_pid: { type: integer, minimum: 1 }
        worker_count: { type: integer, minimum: 0 }
        http_status: { type: integer, minimum: 100, maximum: 599 }
        last_error_code: { type: string, pattern: "^[A-Z0-9_]+$", maxLength: 64 }
        request_id: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ConfigErrorCode:
      type: string
      enum:
        - CONFIG_PATH_INVALID
        - CONFIG_ENTRY_NOT_MANAGED
        - CONFIG_LIMIT_EXCEEDED
        - CONFIG_WORKSPACE_NOT_FOUND
        - CONFIG_PUBLISH_CHECK_NOT_FOUND
        - CONFIG_RELEASE_NOT_FOUND
        - CONFIG_WORKSPACE_CONFLICT
        - CONFIG_WORKSPACE_STALE
        - CONFIG_WORKSPACE_NEEDS_ATTENTION
        - CONFIG_SNAPSHOT_CHANGED
        - CONFIG_PRODUCTION_CHANGED
        - CONFIG_BACKUP_INVALID
        - NGINX_HEALTH_UNAVAILABLE
        - CONFIG_RELEASE_NEEDS_ATTENTION
        - AGENT_UNAVAILABLE
        - CONFIG_OPERATION_TIMEOUT
        - CONFIG_CANDIDATE_INVALID
        - CONFIG_NO_CHANGES
        - CONFIG_PUBLISH_CHECK_EXPIRED
        - CONFIG_PUBLISH_IN_PROGRESS
        - CONFIG_OPERATION_IN_PROGRESS
        - CONFIG_BACKUP_PROTECTED
        - CONFIG_RETENTION_PLAN_EXPIRED
        - CONFIG_ATTENTION_UNRESOLVED
        - CONFIG_BACKUP_TARGET_INVALID
        - CONFIG_RESTORE_NEEDS_ATTENTION
        - NGINX_RESTART_CONFIG_INVALID
        - NGINX_RESTART_FAILED
        - NGINX_RESTART_NEEDS_ATTENTION
        - CONFIG_BACKUP_NOT_FOUND
        - CONFIG_RETENTION_RUN_NOT_FOUND
        - CONFIG_RESTORE_NOT_FOUND
        - NGINX_RESTART_NOT_FOUND
        - CONFIG_ATTENTION_CASE_NOT_FOUND
    ConfigAPIErrorCode:
      oneOf:
        - $ref: "#/components/schemas/ConfigErrorCode"
        - type: string
          enum: [invalid_request, unauthenticated, origin_rejected, csrf_rejected, unsupported_media_type, service_unavailable, internal_error]
    ConfigAPIErrorDetails:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
          description: Safe configuration-root relative path; semantic limit is 1024 UTF-8 bytes and 64 components.
        field:
          type: string
          enum: [attention_case_id, attention_id, backup_id, body, confirm_backup_id, confirm_name, confirm_path, confirmation, content, destination_path, expected_protected, group_id, include_deleted, limit, members, name, path, protected, query, reason, restart_id, restore_id, retention_id, source_path, state, workspace_id]
        backup_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        stage:
          type: string
          pattern: "^[a-z0-9_]+$"
        state:
          type: string
          pattern: "^[a-z0-9_]+$"
        reason_code:
          type: string
          pattern: "^[a-z0-9_]+$"
        object_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        http_status:
          type: integer
          minimum: 100
          maximum: 599
        current_etag:
          type: string
          pattern: '^"(?:draft|groups)-v1:[0-9a-f]{64}"$'
        limit_name:
          type: string
          enum: [request_body_bytes, file_bytes, entries, managed_bytes, workspaces, workspace_bytes, groups, group_members, total_group_members, diff_response_bytes, search_matches, search_query_bytes, include_token_bytes, include_directive_bytes, include_edges, include_depth]
        limit_value:
          type: integer
          format: int64
          minimum: 0
        actual:
          type: integer
          format: int64
          minimum: 0
    ConfigAPIErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          $ref: "#/components/schemas/ConfigAPIErrorCode"
        message:
          type: string
        request_id:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
        details:
          $ref: "#/components/schemas/ConfigAPIErrorDetails"
    APIErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ConfigAPIErrorBody"
