        target_backup_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        safety_backup_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        attention_case_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        state: { type: string, enum: [queued, running, rolling_back, succeeded, failed, rolled_back, needs_attention, cancelled] }
        stage:
          type: string
          enum: [queued, target_verifying, target_validated, safety_backup_creating, safety_backup_verified, files_restoring, files_restored, production_validated, reload_requested, runtime_confirmed, succeeded, rollback_applying, rollback_files_restored, rollback_validated, rollback_reload_requested, rolled_back, failed, needs_attention]
        source_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        target_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        last_error_code: { type: string, pattern: "^[A-Z0-9_]+$", maxLength: 64 }
        reason: { type: string, minLength: 1, maxLength: 256 }
        request_id: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        stages:
