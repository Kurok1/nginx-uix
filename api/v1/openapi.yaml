      type: object
      additionalProperties: false
      required: [passed, complete, results]
      properties:
        passed: { type: boolean }
        complete: { type: boolean }
        results:
          type: array
          minItems: 0
          maxItems: 3
          items: { $ref: "#/components/schemas/RouteAssertionResult" }
    RouteDefinition:
      type: object
      additionalProperties: false
      required: [route_id, node_id, parent_route_id, kind, matcher_type, matcher, source]
      properties:
        route_id: { type: string, minLength: 1, maxLength: 128 }
        node_id: { type: string, minLength: 1, maxLength: 128 }
        parent_route_id: { type: string, maxLength: 128 }
        kind: { type: string, enum: [server, location] }
