      properties:
        scheme: { type: string, enum: [http, https] }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        sni: { type: string }
        method: { type: string, enum: [GET, HEAD, OPTIONS, POST, PUT, PATCH, DELETE] }
        uri: { type: string }
        query: { type: string }
        headers:
          type: array
          minItems: 0
          maxItems: 32
          items: { $ref: "#/components/schemas/RouteRequestHeader" }
        sensitive_header_names:
          type: array
          minItems: 0
          maxItems: 32
          items: { type: string }
        body_bytes: { type: integer, format: int64, minimum: 0, maximum: 65536 }
        body_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        timeout_ms: { type: integer, format: int64, minimum: 100, maximum: 30000 }
        assertions: { $ref: "#/components/schemas/RouteAssertionsInput" }
        side_effecting: { type: boolean }
        replayable: { type: boolean }
    RouteAssertionResult:
      type: object
      additionalProperties: false
      required: [kind, passed, complete]
      properties:
