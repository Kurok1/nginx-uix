        read_only_reason:
          type: string
          pattern: "^[a-z0-9_]*$"
          maxLength: 64
        instances:
          type: integer
          minimum: 1
          maximum: 16384
    StructuredHTTPBlock:
      type: object
      additionalProperties: false
      required: [id, source, editable, instances]
      properties:
        id: { type: string, pattern: "^[0-9a-f]{32}$" }
        source:
          $ref: "#/components/schemas/StructuredSource"
        editable:
          type: boolean
        read_only_reason:
          type: string
          pattern: "^[a-z0-9_]*$"
          maxLength: 64
        instances:
          type: integer
