# @author hanchao <hanchao@66yunlian.com>
# @since 0.1.0
openapi: 3.1.0
info:
  title: Nginx UIX API
  version: 0.1.0
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the UI process can serve HTTP
      responses:
        "200":
          description: UI process is live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessStatus"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check aggregate management readiness
      responses:
        "200":
          description: Required management components are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: At least one required component is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /api/v1/auth/session:
    post:
      operationId: createSession
      summary: Authenticate the administrator
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "413":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "429":
          description: Login rate limit is active
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      operationId: getSession
      summary: Restore the current authenticated session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/APIError"
    delete:
      operationId: deleteSession
      summary: End the current authenticated session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "204":
          description: Session removed and browser cookie expired
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      summary: Get the aggregate UI, Agent and verified Nginx status
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Aggregate status, including partial evidence when the Agent is unavailable
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/nginx/effective-config:
    get:
      operationId: getEffectiveConfig
      summary: Get the ordered effective configuration reported by nginx -T
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Byte-verified ordered configuration or a bounded raw nginx -T fallback
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveConfig"
        "401":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
        "502":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/APIError"
        "504":
          $ref: "#/components/responses/APIError"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nginx_uix_session
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"
  responses:
    APIError:
      description: Stable API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    LivenessStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    SessionUser:
      type: object
      additionalProperties: false
      required: [id, username, created_at]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        created_at:
          type: string
          format: date-time
    Session:
      type: object
      additionalProperties: false
      required: [user, csrf_token, created_at, last_seen_at, idle_expires_at, absolute_expires_at]
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        csrf_token:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
    SystemStatus:
      type: object
      additionalProperties: false
      required: [sampled_at, components, master, workers, build, startup_validation, recovery, issues]
      properties:
        sampled_at:
          type: string
          format: date-time
        components:
          $ref: "#/components/schemas/SystemStatusComponents"
        master:
          oneOf:
            - $ref: "#/components/schemas/SystemProcess"
            - type: "null"
        workers:
          type: array
          items:
            $ref: "#/components/schemas/SystemProcess"
        build:
          oneOf:
            - $ref: "#/components/schemas/SystemBuild"
            - type: "null"
        startup_validation:
          oneOf:
            - $ref: "#/components/schemas/StartupValidation"
            - type: "null"
        recovery:
          oneOf:
            - $ref: "#/components/schemas/RecoveryState"
            - type: "null"
        issues:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Z][A-Z0-9_]*$"
    SystemStatusComponents:
      type: object
      additionalProperties: false
      required: [ui, agent, nginx]
      properties:
        ui:
          type: string
          enum: [healthy]
        agent:
          type: string
          enum: [healthy, unavailable]
        nginx:
          type: string
          enum: [running, degraded, stopped, unknown]
    SystemProcess:
      type: object
      additionalProperties: false
      required: [pid, role, started_at]
      properties:
        pid:
          type: integer
          minimum: 1
        role:
          type: string
          enum: [master, worker]
        started_at:
          type: string
          format: date-time
    SystemBuild:
      type: object
      additionalProperties: false
      required: [version, configure_arguments]
      properties:
        version:
          type: string
        configure_arguments:
          type: array
          items:
            type: string
    StartupValidation:
      type: object
      additionalProperties: false
      required: [valid, checked_at, exit_code, diagnostic]
      properties:
        valid:
          type: boolean
        checked_at:
          type: string
          format: date-time
        exit_code:
          type: [integer, "null"]
        diagnostic:
          type: string
          maxLength: 262144
    RecoveryState:
      type: object
      additionalProperties: false
      required: [count, last_result, permanent]
      properties:
        count:
          type: integer
          minimum: 0
        last_result:
          type: string
          enum: ["", restarting, invalid_config, permanent_failure]
        permanent:
          type: boolean
    EffectiveConfig:
      type: object
      additionalProperties: false
      required:
        [
          generated_at,
          nginx_version,
          entry_config_path,
          display_mode,
          occurrence_count,
          occurrences,
          raw_content,
          warnings,
        ]
      properties:
        generated_at:
          type: string
          format: date-time
        nginx_version:
          type: string
        entry_config_path:
          type: string
          const: /etc/nginx/nginx.conf
        display_mode:
          type: string
          enum: [structured, raw]
        occurrence_count:
          type: integer
          minimum: 0
        occurrences:
          type: array
          items:
            $ref: "#/components/schemas/ConfigOccurrence"
        raw_content:
          type: [string, "null"]
          maxLength: 16777216
        warnings:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/EffectiveConfigWarning"
      oneOf:
        - title: Byte-verified file occurrences
          properties:
            display_mode:
              const: structured
            raw_content:
              type: "null"
            warnings:
              maxItems: 0
        - title: Unstructured bounded nginx output
          properties:
            display_mode:
              const: raw
            occurrence_count:
              const: 0
            occurrences:
              maxItems: 0
            raw_content:
              type: string
              minLength: 1
            warnings:
              minItems: 1
    EffectiveConfigWarning:
      type: string
      enum:
        - NGINX_CONFIG_PATH_OUTSIDE_ALLOWED_ROOTS
        - NGINX_CONFIG_STRUCTURE_UNVERIFIED
    ConfigOccurrence:
      type: object
      additionalProperties: false
      required: [id, load_order, path, content]
      properties:
        id:
          type: string
        load_order:
          type: integer
          minimum: 1
        path:
          type: string
        content:
          type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
