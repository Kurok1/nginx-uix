        deleted_at: { type: string, format: date-time }
    BackupProtectionRequest:
      type: object
      additionalProperties: false
      required: [expected_protected, protected, reason, confirmation]
      properties:
        expected_protected: { type: boolean }
        protected: { type: boolean }
        reason:
          type: string
          maxLength: 256
          description: Required, trimmed operator reason when adding manual protection; empty when removing it.
        confirmation:
          type: string
          maxLength: 32
          description: Empty when protecting; exact full backup ID when removing manual protection.
    RetentionExecutionRequest:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: Exact full visible retention run ID.
    RetentionPolicy:
      type: object
      additionalProperties: false
      required: [minimum_complete, maximum_complete, maximum_total_bytes, minimum_age_seconds]
      properties:
        minimum_complete: { type: integer, minimum: 1 }
        maximum_complete: { type: integer, minimum: 1 }
        maximum_total_bytes: { type: integer, format: int64, minimum: 1 }
        minimum_age_seconds: { type: integer, format: int64, minimum: 0 }
    RetentionItem:
      type: object
      additionalProperties: false
      required: [ordinal, backup_id, decision, reason_code, state, snapshot_created_at, snapshot_total_bytes]
      properties:
        ordinal: { type: integer, minimum: 1 }
        backup_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        decision: { type: string, enum: [keep, delete] }
        reason_code: { type: string, pattern: "^[a-z0-9_]+$", minLength: 1, maxLength: 64 }
        state: { type: string, enum: [planned, kept, deleting, deleted, skipped_protected, failed, needs_attention] }
        snapshot_created_at: { type: string, format: date-time }
        snapshot_total_bytes: { type: integer, format: int64, minimum: 0 }
    RetentionRun:
