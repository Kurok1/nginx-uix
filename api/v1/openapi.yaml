      properties:
        matches:
          type: array
          minItems: 0
          maxItems: 500
          items:
            $ref: "#/components/schemas/SearchMatch"
        complete:
          type: boolean
    SearchMatch:
      type: object
      additionalProperties: false
      required: [path, line, column, snippet]
      properties:
        path:
          type: string
