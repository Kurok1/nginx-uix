      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        sort_order:
          type: integer
        members:
          type: array
          minItems: 0
          maxItems: 1024
          uniqueItems: true
          items:
            type: string
            description: Configuration-root relative member path; semantic limit is 1024 UTF-8 bytes and 64 components.
    DeleteGroupRequest:
