          maxItems: 256
          items:
            type: string
            maxLength: 1024
        summary_truncated:
          type: boolean
        locations:
          type: array
          minItems: 0
          maxItems: 10000
          items:
            $ref: "#/components/schemas/StructuredLocation"
        editable:
