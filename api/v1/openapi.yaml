        description: Strict exact-confirmation object limited to 131072 bytes.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateConfirmationRequest" }
      responses:
        "202":
          description: Durable binding task accepted
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: *RecoveryNoStoreHeader
            Location: *RecoveryLocationHeader
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateTask" }
        "400": { $ref: "#/components/responses/ConfigAPIError" }
        "401": { $ref: "#/components/responses/ConfigAPIError" }
        "403": { $ref: "#/components/responses/ConfigAPIError" }
        "404": { $ref: "#/components/responses/ConfigAPIError" }
        "409": { $ref: "#/components/responses/ConfigAPIError" }
        "413": { $ref: "#/components/responses/ConfigAPIError" }
        "415": { $ref: "#/components/responses/ConfigAPIError" }
        "503": { $ref: "#/components/responses/ConfigAPIError" }
  /api/v1/certificates/{certificate_id}/unbindings:
    post:
      operationId: unbindCertificate
      summary: Remove managed SSL directives through the configuration publication transaction
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CertificateID"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        description: Strict exact-confirmation object limited to 131072 bytes.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateConfirmationRequest" }
      responses:
        "200":
          description: Updated certificate metadata after transactional unbinding
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: *RecoveryNoStoreHeader
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "400": { $ref: "#/components/responses/ConfigAPIError" }
        "401": { $ref: "#/components/responses/ConfigAPIError" }
        "403": { $ref: "#/components/responses/ConfigAPIError" }
        "404": { $ref: "#/components/responses/ConfigAPIError" }
        "409": { $ref: "#/components/responses/ConfigAPIError" }
        "413": { $ref: "#/components/responses/ConfigAPIError" }
        "415": { $ref: "#/components/responses/ConfigAPIError" }
        "503": { $ref: "#/components/responses/ConfigAPIError" }
  /api/v1/certificates/{certificate_id}/exports:
    post:
      operationId: exportCertificate
      summary: Download a short-lived PEM response after explicit private-key confirmation
      description: The PEM is never represented in JSON, cached, logged or retained by the API layer.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CertificateID"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        description: Strict export confirmation object limited to 131072 bytes.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateExportRequest" }
      responses:
        "200":
          description: Non-cacheable PEM attachment, optionally including the private key only after exact confirmation
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: *RecoveryNoStoreHeader
          content:
            application/x-pem-file:
              schema: { $ref: "#/components/schemas/CertificatePEM" }
        "400": { $ref: "#/components/responses/ConfigAPIError" }
        "401": { $ref: "#/components/responses/ConfigAPIError" }
        "403": { $ref: "#/components/responses/ConfigAPIError" }
        "404": { $ref: "#/components/responses/ConfigAPIError" }
        "409": { $ref: "#/components/responses/ConfigAPIError" }
        "413": { $ref: "#/components/responses/ConfigAPIError" }
        "415": { $ref: "#/components/responses/ConfigAPIError" }
        "503": { $ref: "#/components/responses/ConfigAPIError" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nginx_uix_session
  headers:
    RequestID:
      description: Correlation identifier generated or accepted by the request boundary.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      description: Opaque workspace identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    GroupID:
      name: group_id
      in: path
      required: true
      description: Opaque logical group identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    CheckID:
      name: check_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    ReleaseID:
      name: release_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    BackupID:
      name: backup_id
      in: path
      required: true
      description: Opaque immutable backup identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    RetentionID:
      name: retention_id
      in: path
      required: true
      description: Opaque retention dry-run identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    RestoreID:
      name: restore_id
      in: path
      required: true
      description: Opaque manual restore task identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    RestartID:
      name: restart_id
      in: path
      required: true
      description: Opaque fixed restart task identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    AttentionID:
      name: attention_id
      in: path
      required: true
      description: Opaque attention-case identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    RouteRunID:
      name: run_id
      in: path
      required: true
      description: Opaque Route Lab run identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    CertificateAccountID:
      name: account_id
      in: path
      required: true
      description: Opaque ACME account identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    CertificateCredentialID:
      name: credential_id
      in: path
      required: true
      description: Opaque encrypted DNS credential identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    CertificateOrderPlanID:
      name: plan_id
      in: path
      required: true
      description: Opaque issuance review identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    CertificateTaskID:
      name: task_id
      in: path
      required: true
      description: Opaque durable certificate task identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    CertificateID:
      name: certificate_id
      in: path
      required: true
      description: Opaque managed certificate identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    CertificateBindingPlanID:
      name: plan_id
      in: path
      required: true
      description: Opaque standalone binding review identifier.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    RecoveryCursor:
      name: cursor
      in: query
      required: false
      description: Opaque versioned keyset cursor accepted exactly once when present.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
        pattern: "^[A-Za-z0-9_-]+$"
    RecoveryLimit:
      name: limit
      in: query
      required: false
      description: Page size from 1 through 100 accepted exactly once when present; defaults to 50.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    CertificateLimit:
      name: limit
      in: query
      required: false
      description: Result count from 1 through 100 accepted exactly once when present; defaults to 20.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    IncludeDeleted:
      name: include_deleted
      in: query
      required: false
      description: Boolean tombstone selector accepted exactly once when present; defaults to false.
      schema:
        type: boolean
    AttentionState:
      name: state
      in: query
      required: false
      description: Optional case-state selector accepted exactly once when present.
      schema:
        type: string
        enum: [open, resolved]
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: Last persisted stage sequence received by the client.
      schema:
        type: integer
        minimum: 0
        maximum: 512
    RequiredConfigPath:
      name: path
      in: query
      required: true
      description: Relative configuration path required exactly once; 1024 UTF-8 bytes maximum.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exactly one quoted strong workspace or group collection identity; weak and comma-separated values are rejected.
      schema:
        type: string
        pattern: '^"(?:draft|groups)-v1:[0-9a-f]{64}"$'
  responses:
    APIError:
      description: Stable API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ConfigAPIError:
      description: Stable configuration API error
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
  schemas:
    LivenessStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    SessionUser:
      type: object
      additionalProperties: false
      required: [id, username, created_at]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        created_at:
          type: string
          format: date-time
    Session:
      type: object
      additionalProperties: false
      required: [user, csrf_token, created_at, last_seen_at, idle_expires_at, absolute_expires_at]
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        csrf_token:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
    SystemStatus:
      type: object
      additionalProperties: false
      required: [sampled_at, components, master, workers, build, startup_validation, recovery, issues]
      properties:
        sampled_at:
          type: string
          format: date-time
        components:
          $ref: "#/components/schemas/SystemStatusComponents"
        master:
          oneOf:
            - $ref: "#/components/schemas/SystemProcess"
            - type: "null"
        workers:
          type: array
          items:
            $ref: "#/components/schemas/SystemProcess"
        build:
          oneOf:
            - $ref: "#/components/schemas/SystemBuild"
            - type: "null"
        startup_validation:
          oneOf:
            - $ref: "#/components/schemas/StartupValidation"
            - type: "null"
        recovery:
          oneOf:
            - $ref: "#/components/schemas/RecoveryState"
            - type: "null"
        issues:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Z][A-Z0-9_]*$"
    SystemStatusComponents:
      type: object
      additionalProperties: false
      required: [ui, agent, nginx]
      properties:
        ui:
          type: string
          enum: [healthy]
        agent:
          type: string
          enum: [healthy, unavailable]
        nginx:
          type: string
          enum: [running, degraded, stopped, unknown]
    SystemProcess:
      type: object
      additionalProperties: false
      required: [pid, role, started_at]
      properties:
        pid:
          type: integer
          minimum: 1
        role:
          type: string
          enum: [master, worker]
        started_at:
          type: string
          format: date-time
    SystemBuild:
      type: object
      additionalProperties: false
      required: [version, configure_arguments]
      properties:
        version:
          type: string
        configure_arguments:
          type: array
          items:
            type: string
    StartupValidation:
      type: object
      additionalProperties: false
      required: [valid, checked_at, exit_code, diagnostic]
      properties:
        valid:
          type: boolean
        checked_at:
          type: string
          format: date-time
        exit_code:
          type: [integer, "null"]
        diagnostic:
          type: string
          maxLength: 262144
    RecoveryState:
      type: object
      additionalProperties: false
      required: [count, last_result, permanent]
      properties:
        count:
          type: integer
          minimum: 0
        last_result:
          type: string
          enum: ["", restarting, invalid_config, permanent_failure]
        permanent:
          type: boolean
    EffectiveConfig:
      type: object
      additionalProperties: false
      required:
        [
          generated_at,
          nginx_version,
          entry_config_path,
          display_mode,
          occurrence_count,
          occurrences,
          raw_content,
          warnings,
        ]
      properties:
        generated_at:
          type: string
          format: date-time
        nginx_version:
          type: string
        entry_config_path:
          type: string
          const: /etc/nginx/nginx.conf
        display_mode:
          type: string
          enum: [structured, raw]
        occurrence_count:
          type: integer
          minimum: 0
        occurrences:
          type: array
          items:
            $ref: "#/components/schemas/ConfigOccurrence"
        raw_content:
          type: [string, "null"]
          maxLength: 16777216
        warnings:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/EffectiveConfigWarning"
      oneOf:
        - title: Byte-verified file occurrences
          properties:
            display_mode:
              const: structured
            raw_content:
              type: "null"
            warnings:
              maxItems: 0
        - title: Unstructured bounded nginx output
          properties:
            display_mode:
              const: raw
            occurrence_count:
              const: 0
            occurrences:
              maxItems: 0
            raw_content:
              type: string
              minLength: 1
            warnings:
              minItems: 1
    EffectiveConfigWarning:
      type: string
      enum:
        - NGINX_CONFIG_PATH_OUTSIDE_ALLOWED_ROOTS
        - NGINX_CONFIG_STRUCTURE_UNVERIFIED
    ConfigOccurrence:
      type: object
      additionalProperties: false
      required: [id, load_order, path, content]
      properties:
        id:
          type: string
        load_order:
          type: integer
          minimum: 1
        path:
          type: string
        content:
          type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    WorkspaceSummary:
      type: object
      additionalProperties: false
      required: [id, name, state, production_digest, base_digest, draft_etag, entry_count, managed_bytes, workspace_bytes, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        name:
          type: string
          minLength: 1
          maxLength: 80
        state:
          type: string
          enum: [preparing, ready, stale, published, needs_attention]
        state_reason_code:
          type: string
          pattern: "^[a-z0-9_]*$"
        production_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        base_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        draft_etag:
          type: string
          description: Quoted strong workspace identity using the draft-v1 canonical digest algorithm.
          pattern: '^"draft-v1:[0-9a-f]{64}"$'
        entry_count:
          type: integer
          minimum: 0
          maximum: 4096
        managed_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 33554432
        workspace_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 536870912
        created_by:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_release_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
    WorkspaceDetail:
      type: object
      additionalProperties: false
      required: [id, name, state, production_digest, base_digest, draft_etag, entry_count, managed_bytes, workspace_bytes, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        name:
          type: string
          minLength: 1
          maxLength: 80
        state:
          type: string
          enum: [preparing, ready, stale, published, needs_attention]
        state_reason_code:
          type: string
          pattern: "^[a-z0-9_]*$"
        production_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        base_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        draft_etag:
          type: string
          description: Quoted strong workspace identity using the draft-v1 canonical digest algorithm.
          pattern: '^"draft-v1:[0-9a-f]{64}"$'
        entry_count:
          type: integer
          minimum: 0
          maximum: 4096
        managed_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 33554432
        workspace_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 536870912
        created_by:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_release_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
    CreateReleaseRequest:
      type: object
      additionalProperties: false
      required: [check_id, confirm_name]
      properties:
        check_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        confirm_name:
          type: string
          minLength: 1
          maxLength: 128
    EmptyObject:
      type: object
      additionalProperties: false
    CandidateDiagnostic:
      type: object
      additionalProperties: false
      required: [code, path, line, summary]
      properties:
        code: { type: string, pattern: "^[a-z0-9_]+$", minLength: 1, maxLength: 64 }
        path:
          type: string
          maxLength: 1024
          description: Empty when no safe candidate-relative path can be identified.
        line: { type: integer, minimum: 0, maximum: 10000000 }
        summary: { type: string, minLength: 1, maxLength: 512 }
    PublishCheck:
      type: object
      additionalProperties: false
      required: [id, workspace_id, workspace_revision, production_digest, base_digest, draft_digest, candidate_digest, manifest_version, policy_version, validator_version, validator_build_id, state, diagnostic_count, details, started_at, finished_at, expires_at]
      properties:
        id: { type: string, pattern: "^[0-9a-f]{32}$" }
        workspace_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        workspace_revision: { type: integer, minimum: 1 }
        production_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        base_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        draft_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        candidate_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        manifest_version: { type: integer, minimum: 1 }
        policy_version: { type: integer, minimum: 1 }
        validator_version: { type: integer, minimum: 1 }
        validator_build_id: { type: string }
        state: { type: string, enum: [running, valid, invalid, failed] }
        diagnostic_count: { type: integer, minimum: 0 }
        details:
          type: object
          additionalProperties: false
          required: [diagnostics]
          properties:
            diagnostics:
              type: array
              items: { $ref: "#/components/schemas/CandidateDiagnostic" }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    ReleaseStage:
      type: object
      additionalProperties: false
      required: [sequence, stage, result, details, occurred_at]
      properties:
        sequence: { type: integer, minimum: 1 }
        stage:
          type: string
          enum: [queued, rechecking, backup_creating, backup_verified, candidate_validated, files_applying, files_applied, production_validated, reload_requested, runtime_confirmed, committed, rollback_applying, rollback_files_restored, rollback_validated, rollback_reload_requested, rolled_back, failed, needs_attention]
        result: { type: string, enum: [pending, running, success, failed, warning] }
        code: { type: string }
        details: { type: object, additionalProperties: true }
        occurred_at: { type: string, format: date-time }
    Release:
      type: object
      additionalProperties: false
      required: [id, workspace_id, check_id, state, stage, production_digest, draft_digest, candidate_digest, created_at, updated_at, stages]
      properties:
        id: { type: string, pattern: "^[0-9a-f]{32}$" }
        workspace_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        check_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        backup_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        state: { type: string, enum: [queued, running, rolling_back, succeeded, failed, rolled_back, needs_attention, cancelled] }
        stage:
          type: string
          enum: [queued, rechecking, backup_creating, backup_verified, candidate_validated, files_applying, files_applied, production_validated, reload_requested, runtime_confirmed, committed, rollback_applying, rollback_files_restored, rollback_validated, rollback_reload_requested, rolled_back, failed, needs_attention]
        production_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        draft_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        candidate_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        last_error_code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        stages:
          type: array
          maxItems: 512
          items: { $ref: "#/components/schemas/ReleaseStage" }
    WorkspaceList:
      type: object
      additionalProperties: false
      required: [workspaces]
      properties:
        workspaces:
          type: array
          minItems: 0
          maxItems: 8
          items:
            $ref: "#/components/schemas/WorkspaceSummary"
    ConfigTree:
      type: object
      additionalProperties: false
      required: [entries, dependencies, draft_etag]
      properties:
        entries:
          type: array
          minItems: 0
          maxItems: 4096
          items:
            $ref: "#/components/schemas/ConfigTreeNode"
        dependencies:
          type: array
          minItems: 0
          maxItems: 16384
          items:
            $ref: "#/components/schemas/ConfigDependency"
        draft_etag:
          type: string
          description: Quoted strong workspace identity.
          pattern: '^"draft-v1:[0-9a-f]{64}"$'
    ConfigTreeNode:
      type: object
      additionalProperties: false
      required: [path, name, entry_type, managed, read_only, status_reason_code]
      properties:
        path:
          type: string
          description: Configuration-root relative path; semantic limit is 1024 UTF-8 bytes and 64 components.
        name:
          type: string
          description: Final relative path component, at most 255 UTF-8 bytes subject to the filesystem name limit.
        entry_type:
          type: string
          enum: [regular, directory, symlink, special]
        managed:
          type: boolean
        read_only:
          type: boolean
        status_reason_code:
          type: string
          enum: [managed_text, sensitive_material, not_candidate, invalid_text, file_limit, directory, symlink_internal, symlink_external, symlink_unavailable, special]
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        content_digest:
          type: string
          description: Present only for managed text; omitted for sensitive and all other unmanaged nodes.
          pattern: "^[0-9a-f]{64}$"
        diff_status:
          type: string
          description: Optional base-to-draft status for a regular file; deleted paths are normally reported by DiffResponse.
          enum: [unchanged, created, modified, deleted]
        dependency_status:
          type: string
          enum: [resolved, missing, external, unresolved, symlink, special, cycle]
        dependency_target_count:
          type: integer
          minimum: 0
          maximum: 16384
        dependency_cycle:
          type: boolean
    ConfigDependency:
      type: object
      additionalProperties: false
      required: [source, line, column, display_value, status, cycle]
      properties:
        source:
          type: string
          description: Configuration-root relative source path; semantic limit is 1024 UTF-8 bytes and 64 components.
        line:
          type: integer
          minimum: 1
        column:
          type: integer
          minimum: 1
        display_value:
          type: string
          maxLength: 262144
        target:
          type: string
          description: Optional safe configuration-root relative target path; semantic limit is 1024 UTF-8 bytes and 64 components.
        status:
          type: string
          enum: [resolved, missing, external, unresolved, symlink, special, cycle]
        cycle:
          type: boolean
    ConfigFile:
      type: object
      additionalProperties: false
      required: [path, content, size_bytes, content_digest, line_ending, draft_etag]
      properties:
        path:
          type: string
          description: Configuration-root relative path; semantic limit is 1024 UTF-8 bytes and 64 components.
        content:
          type: string
          description: Explicitly requested managed UTF-8 file content, semantically limited to 2097152 UTF-8 bytes.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 2097152
        content_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        line_ending:
          type: string
          enum: [none, lf, crlf, mixed]
        draft_etag:
          type: string
          description: Quoted strong workspace identity.
          pattern: '^"draft-v1:[0-9a-f]{64}"$'
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Trimmed display name; control and bidirectional control characters are rejected.
    CreateFileRequest:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path:
          type: string
          description: New configuration-root relative path; semantic limit is 1024 UTF-8 bytes and 64 components.
        content:
          type: string
          description: Managed UTF-8 content, semantically limited to 2097152 UTF-8 bytes and containing no NUL.
    ReplaceFileRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          description: Complete managed UTF-8 replacement, semantically limited to 2097152 UTF-8 bytes and containing no NUL.
    RenameFileRequest:
      type: object
      additionalProperties: false
      required: [destination_path]
      properties:
        destination_path:
          type: string
          description: New non-existing configuration-root relative path; semantic limit is 1024 UTF-8 bytes and 64 components.
    CopyFileRequest:
      type: object
      additionalProperties: false
      required: [source_path, destination_path]
      properties:
        source_path:
          type: string
          description: Existing managed configuration-root relative path; semantic limit is 1024 UTF-8 bytes and 64 components.
        destination_path:
          type: string
          description: New non-existing configuration-root relative path; semantic limit is 1024 UTF-8 bytes and 64 components.
    DeleteWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [confirm_name]
      properties:
        confirm_name:
          type: string
          minLength: 1
          maxLength: 80
    DeleteFileRequest:
      type: object
      additionalProperties: false
      required: [confirm_path]
      properties:
        confirm_path:
