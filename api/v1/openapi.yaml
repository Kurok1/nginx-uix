        finished_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    ReleaseStage:
      type: object
      additionalProperties: false
      required: [sequence, stage, result, details, occurred_at]
      properties:
        sequence: { type: integer, minimum: 1 }
        stage:
          type: string
          enum: [queued, rechecking, backup_creating, backup_verified, candidate_validated, files_applying, files_applied, production_validated, reload_requested, runtime_confirmed, committed, rollback_applying, rollback_files_restored, rollback_validated, rollback_reload_requested, rolled_back, failed, needs_attention]
        result: { type: string, enum: [pending, running, success, failed, warning] }
        code: { type: string }
        details: { type: object, additionalProperties: true }
        occurred_at: { type: string, format: date-time }
    Release:
      type: object
      additionalProperties: false
      required: [id, workspace_id, check_id, state, stage, production_digest, draft_digest, candidate_digest, created_at, updated_at, stages]
      properties:
        id: { type: string, pattern: "^[0-9a-f]{32}$" }
        workspace_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        check_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        backup_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        state: { type: string, enum: [queued, running, rolling_back, succeeded, failed, rolled_back, needs_attention, cancelled] }
        stage:
          type: string
          enum: [queued, rechecking, backup_creating, backup_verified, candidate_validated, files_applying, files_applied, production_validated, reload_requested, runtime_confirmed, committed, rollback_applying, rollback_files_restored, rollback_validated, rollback_reload_requested, rolled_back, failed, needs_attention]
        production_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        draft_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        candidate_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        last_error_code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        stages:
          type: array
          maxItems: 512
          items: { $ref: "#/components/schemas/ReleaseStage" }
    WorkspaceList:
      type: object
      additionalProperties: false
      required: [workspaces]
      properties:
        workspaces:
          type: array
          minItems: 0
          maxItems: 8
          items:
            $ref: "#/components/schemas/WorkspaceSummary"
    ConfigTree:
      type: object
      additionalProperties: false
      required: [entries, dependencies, draft_etag]
      properties:
        entries:
          type: array
          minItems: 0
          maxItems: 4096
          items:
            $ref: "#/components/schemas/ConfigTreeNode"
        dependencies:
          type: array
          minItems: 0
          maxItems: 16384
          items:
            $ref: "#/components/schemas/ConfigDependency"
        draft_etag:
          type: string
          description: Quoted strong workspace identity.
          pattern: '^"draft-v1:[0-9a-f]{64}"$'
    ConfigTreeNode:
      type: object
      additionalProperties: false
      required: [path, name, entry_type, managed, read_only, status_reason_code]
      properties:
        path:
          type: string
          description: Configuration-root relative path; semantic limit is 1024 UTF-8 bytes and 64 components.
        name:
          type: string
          description: Final relative path component, at most 255 UTF-8 bytes subject to the filesystem name limit.
        entry_type:
          type: string
          enum: [regular, directory, symlink, special]
        managed:
          type: boolean
        read_only:
          type: boolean
        status_reason_code:
          type: string
          enum: [managed_text, sensitive_material, not_candidate, invalid_text, file_limit, directory, symlink_internal, symlink_external, symlink_unavailable, special]
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        content_digest:
          type: string
          description: Present only for managed text; omitted for sensitive and all other unmanaged nodes.
          pattern: "^[0-9a-f]{64}$"
        diff_status:
          type: string
          description: Optional base-to-draft status for a regular file; deleted paths are normally reported by DiffResponse.
          enum: [unchanged, created, modified, deleted]
        dependency_status:
          type: string
          enum: [resolved, missing, external, unresolved, symlink, special, cycle]
        dependency_target_count:
          type: integer
          minimum: 0
          maximum: 16384
        dependency_cycle:
          type: boolean
    ConfigDependency:
      type: object
      additionalProperties: false
      required: [source, line, column, display_value, status, cycle]
      properties:
        source:
          type: string
          description: Configuration-root relative source path; semantic limit is 1024 UTF-8 bytes and 64 components.
        line:
          type: integer
          minimum: 1
        column:
          type: integer
          minimum: 1
        display_value:
          type: string
          maxLength: 262144
        target:
          type: string
          description: Optional safe configuration-root relative target path; semantic limit is 1024 UTF-8 bytes and 64 components.
        status:
          type: string
          enum: [resolved, missing, external, unresolved, symlink, special, cycle]
        cycle:
          type: boolean
    ConfigFile:
      type: object
      additionalProperties: false
      required: [path, content, size_bytes, content_digest, line_ending, draft_etag]
      properties:
        path:
          type: string
          description: Configuration-root relative path; semantic limit is 1024 UTF-8 bytes and 64 components.
        content:
          type: string
          description: Explicitly requested managed UTF-8 file content, semantically limited to 2097152 UTF-8 bytes.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 2097152
        content_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        line_ending:
          type: string
          enum: [none, lf, crlf, mixed]
        draft_etag:
          type: string
          description: Quoted strong workspace identity.
          pattern: '^"draft-v1:[0-9a-f]{64}"$'
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Trimmed display name; control and bidirectional control characters are rejected.
    CreateFileRequest:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path:
          type: string
          description: New configuration-root relative path; semantic limit is 1024 UTF-8 bytes and 64 components.
        content:
          type: string
          description: Managed UTF-8 content, semantically limited to 2097152 UTF-8 bytes and containing no NUL.
    ReplaceFileRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          description: Complete managed UTF-8 replacement, semantically limited to 2097152 UTF-8 bytes and containing no NUL.
    RenameFileRequest:
      type: object
      additionalProperties: false
      required: [destination_path]
      properties:
        destination_path:
          type: string
          description: New non-existing configuration-root relative path; semantic limit is 1024 UTF-8 bytes and 64 components.
    CopyFileRequest:
      type: object
      additionalProperties: false
      required: [source_path, destination_path]
      properties:
        source_path:
          type: string
          description: Existing managed configuration-root relative path; semantic limit is 1024 UTF-8 bytes and 64 components.
        destination_path:
          type: string
          description: New non-existing configuration-root relative path; semantic limit is 1024 UTF-8 bytes and 64 components.
    DeleteWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [confirm_name]
      properties:
        confirm_name:
          type: string
          minLength: 1
          maxLength: 80
    DeleteFileRequest:
      type: object
      additionalProperties: false
      required: [confirm_path]
      properties:
        confirm_path:
          type: string
          description: Exact configuration-root relative path confirmation; semantic limit is 1024 UTF-8 bytes and 64 components.
    FileMutationResponse:
      type: object
      additionalProperties: false
      required: [workspace, draft_etag]
      properties:
        workspace:
          $ref: "#/components/schemas/WorkspaceDetail"
        entry:
          $ref: "#/components/schemas/ConfigTreeNode"
        draft_etag:
          type: string
          description: Same quoted strong workspace identity returned in the ETag header.
          pattern: '^"draft-v1:[0-9a-f]{64}"$'
    DiffResponse:
      type: object
      additionalProperties: false
      required: [files, complete, reason, patch]
      properties:
        files:
          type: array
          minItems: 0
          maxItems: 4096
          items:
            $ref: "#/components/schemas/FileDiffSummary"
        complete:
          type: boolean
        reason:
          type: string
          enum: ["", response_limit]
        patch:
          type: string
          description: Complete unified text when complete is true; empty when the bounded response cannot carry it.
    FileDiffSummary:
      type: object
      additionalProperties: false
      required: [path, status, added_lines, removed_lines]
      properties:
        path:
          type: string
          description: Configuration-root relative path; semantic limit is 1024 UTF-8 bytes and 64 components.
        status:
          type: string
          enum: [unchanged, created, deleted, modified]
        added_lines:
          type: integer
          minimum: 0
        removed_lines:
          type: integer
          minimum: 0
    SearchResponse:
      type: object
      additionalProperties: false
      required: [matches, complete]
      properties:
        matches:
          type: array
          minItems: 0
          maxItems: 500
          items:
            $ref: "#/components/schemas/SearchMatch"
        complete:
          type: boolean
    SearchMatch:
      type: object
      additionalProperties: false
      required: [path, line, column, snippet]
      properties:
        path:
          type: string
          description: Configuration-root relative path; semantic limit is 1024 UTF-8 bytes and 64 components.
        line:
          type: integer
          minimum: 1
        column:
          type: integer
          minimum: 1
        snippet:
          type: string
          maxLength: 240
          description: Bounded single-line text returned only by an explicit search response.
    GroupCollection:
      type: object
      additionalProperties: false
      required: [groups, groups_etag]
      properties:
        groups:
          type: array
          minItems: 0
          maxItems: 128
          items:
            $ref: "#/components/schemas/ConfigGroup"
        groups_etag:
          type: string
          description: Same quoted strong group collection identity returned in the ETag header.
          pattern: '^"groups-v1:[0-9a-f]{64}"$'
    ConfigGroup:
      type: object
      additionalProperties: false
      required: [id, name, sort_order, members, missing, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        name:
          type: string
          minLength: 1
          maxLength: 64
        sort_order:
          type: integer
        members:
          type: array
          minItems: 0
          maxItems: 1024
          uniqueItems: true
          items:
            type: string
