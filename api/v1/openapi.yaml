        kind:
          type: string
          enum: [upstream.create, upstream.rename, upstream.delete, upstream_server.create, upstream_server.update, upstream_server.delete, location.create, location.update, location.delete]
          description: Discriminator selecting the exactly matching input schema.
        input:
          oneOf:
            - $ref: "#/components/schemas/StructuredUpstreamCreateInput"
            - $ref: "#/components/schemas/StructuredUpstreamRenameInput"
            - $ref: "#/components/schemas/StructuredUpstreamDeleteInput"
            - $ref: "#/components/schemas/StructuredUpstreamServerCreateInput"
            - $ref: "#/components/schemas/StructuredUpstreamServerUpdateInput"
            - $ref: "#/components/schemas/StructuredUpstreamServerDeleteInput"
            - $ref: "#/components/schemas/StructuredLocationCreateInput"
            - $ref: "#/components/schemas/StructuredLocationUpdateInput"
            - $ref: "#/components/schemas/StructuredLocationDeleteInput"
    StructuredApplyRequest:
      type: object
      additionalProperties: false
      required: [preview_id, kind, input]
      properties:
        preview_id: { type: string, pattern: "^[0-9a-f]{64}$" }
        kind:
          type: string
          enum: [upstream.create, upstream.rename, upstream.delete, upstream_server.create, upstream_server.update, upstream_server.delete, location.create, location.update, location.delete]
          description: Discriminator selecting the exactly matching input schema.
        input:
          oneOf:
            - $ref: "#/components/schemas/StructuredUpstreamCreateInput"
            - $ref: "#/components/schemas/StructuredUpstreamRenameInput"
            - $ref: "#/components/schemas/StructuredUpstreamDeleteInput"
            - $ref: "#/components/schemas/StructuredUpstreamServerCreateInput"
            - $ref: "#/components/schemas/StructuredUpstreamServerUpdateInput"
            - $ref: "#/components/schemas/StructuredUpstreamServerDeleteInput"
            - $ref: "#/components/schemas/StructuredLocationCreateInput"
            - $ref: "#/components/schemas/StructuredLocationUpdateInput"
            - $ref: "#/components/schemas/StructuredLocationDeleteInput"
    StructuredChangedFile:
      type: object
      additionalProperties: false
      required: [path, before_digest, after_digest, added_lines, removed_lines, patch]
      properties:
        path:
          type: string
          description: Configuration-root relative changed path; semantic limit is 1024 UTF-8 bytes and 64 components.
        before_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        after_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        added_lines: { type: integer, minimum: 0 }
        removed_lines: { type: integer, minimum: 0 }
        patch:
          type: string
          description: Complete unified diff when complete is true; empty for every file when the response bound is exceeded.
    StructuredChangePreview:
      type: object
      additionalProperties: false
      required: [preview_id, workspace_id, draft_etag, operation_kind, target_id, changed_files, complete]
      properties:
        preview_id: { type: string, pattern: "^[0-9a-f]{64}$" }
        workspace_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        draft_etag: { type: string, pattern: '^"draft-v1:[0-9a-f]{64}"$' }
        operation_kind:
          type: string
          enum: [upstream.create, upstream.rename, upstream.delete, upstream_server.create, upstream_server.update, upstream_server.delete, location.create, location.update, location.delete]
        target_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        changed_files:
          type: array
          minItems: 1
          maxItems: 4096
          items:
            $ref: "#/components/schemas/StructuredChangedFile"
        complete:
          type: boolean
    StructuredChangeResult:
      type: object
      additionalProperties: false
      required: [workspace, draft_etag, changed_paths]
      properties:
        workspace:
          $ref: "#/components/schemas/WorkspaceDetail"
        draft_etag:
          type: string
          pattern: '^"draft-v1:[0-9a-f]{64}"$'
        changed_paths:
          type: array
          minItems: 1
          maxItems: 4096
          items:
            type: string
            description: Configuration-root relative changed path; semantic limit is 1024 UTF-8 bytes and 64 components.
    RouteRequestHeader:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        value: { type: string, maxLength: 8192 }
    RouteAssertionsInput:
      type: object
      additionalProperties: false
      properties:
        status_code:
          oneOf:
            - type: integer
              enum: [0]
            - type: integer
              minimum: 100
              maximum: 599
        contains_text: { type: string, maxLength: 1024 }
        forbidden_text: { type: string, maxLength: 1024 }
    RouteTestRequest:
      type: object
      additionalProperties: false
      required: [scheme, host]
      properties:
        scheme: { type: string, enum: [http, https] }
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 0, maximum: 65535, default: 0 }
        sni: { type: string, maxLength: 253 }
        method: { type: string, enum: [GET, HEAD, OPTIONS, POST, PUT, PATCH, DELETE], default: GET }
        uri: { type: string, minLength: 1, default: / }
        query:
          type: string
          description: Query without a leading question mark; never included in audit logs.
        headers:
          type: array
          minItems: 0
          maxItems: 32
          items: { $ref: "#/components/schemas/RouteRequestHeader" }
        body:
          type: string
          maxLength: 65536
          description: UTF-8 request body; never persisted.
        timeout_ms: { type: integer, minimum: 0, maximum: 30000, default: 0 }
        assertions: { $ref: "#/components/schemas/RouteAssertionsInput" }
        confirmation:
          type: string
          enum: [RUN SIDE-EFFECTING REQUEST]
          description: Required exactly for a body, a method other than GET/HEAD/OPTIONS, or a candidate containing an outbound upstream directive; never persisted.
    RouteSource:
      type: object
      additionalProperties: false
      required: [path, start_line, start_column, end_line, end_column]
      properties:
        path:
          type: string
          description: Configuration-root-relative source path.
        start_line: { type: integer, minimum: 1 }
        start_column: { type: integer, minimum: 1 }
        end_line: { type: integer, minimum: 1 }
        end_column: { type: integer, minimum: 1 }
    RouteListener:
      type: object
      additionalProperties: false
      required: [address, port, ssl, default_server, derived, supported]
      properties:
        address: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        ssl: { type: boolean }
        default_server: { type: boolean }
        derived: { type: boolean }
        supported: { type: boolean }
