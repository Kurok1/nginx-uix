        line:
          type: integer
          minimum: 1
        column:
          type: integer
          minimum: 1
        snippet:
          type: string
          maxLength: 240
          description: Bounded single-line text returned only by an explicit search response.
    GroupCollection:
      type: object
      additionalProperties: false
