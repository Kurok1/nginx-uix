      properties:
        route_id: { type: string, minLength: 1, maxLength: 128 }
        parent_route_id: { type: string, minLength: 1, maxLength: 128 }
        source: { $ref: "#/components/schemas/RouteSource" }
        matcher_type: { $ref: "#/components/schemas/RouteMatcherType" }
        matcher: { type: string }
        depth: { type: integer, minimum: 0, maximum: 128 }
        disposition: { $ref: "#/components/schemas/RouteCandidateDisposition" }
        reason: { $ref: "#/components/schemas/RouteCandidateReason" }
    RouteAnalysis:
