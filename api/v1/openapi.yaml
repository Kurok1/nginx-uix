      properties:
        id: { type: string, pattern: "^[0-9a-f]{32}$" }
        state: { type: string, enum: [planned, executing, succeeded, failed, needs_attention, expired] }
        policy: { $ref: "#/components/schemas/RetentionPolicy" }
        backup_count: { type: integer, minimum: 0 }
        total_bytes: { type: integer, format: int64, minimum: 0 }
        protected_count: { type: integer, minimum: 0 }
        delete_count: { type: integer, minimum: 0 }
        delete_bytes: { type: integer, format: int64, minimum: 0 }
        deleted_count: { type: integer, minimum: 0 }
        deleted_bytes: { type: integer, format: int64, minimum: 0 }
        last_error_code: { type: string, pattern: "^[A-Z0-9_]+$", maxLength: 64 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        items:
