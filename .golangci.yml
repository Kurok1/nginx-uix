# @author hanchao <hanchao@66yunlian.com>
# @since 0.1.0
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: package-comments
          disabled: true
  exclusions:
    paths:
      - web/node_modules
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - web/node_modules

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
